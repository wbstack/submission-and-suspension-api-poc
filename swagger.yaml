  # /manual_unsuspensions:
    post:
      tags:
        - Manual (Un)suspensions
      summary: Create a manual unsuspension
      # description: 
      operationId: createManualUnsuspension
      requestBody: 
        content: 
          application/json: 
            schema: 
              type: object
              required: 
                - wiki_id
                - reason
              properties:
                wiki_id:
                  type: integer
                  minimum: 1
                active_from:
                  type: 
                      - string
