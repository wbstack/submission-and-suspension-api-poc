components:
  parameters:
    WikiId:
      name: wiki_id
      in: path
      # description: 
      required: true
      schema:
        type: integer
        minimum: 1
    ReviewSubmissionId:
      name: review_submission_id
      in: path
      # description: 
      required: true
      schema: 
        type: integer
        minimum: 1

  requestBodies: 
    ReviewSubmission:
      content:
        application/json: 
          schema: 
            type: object
            properties:
              state:
                type: string
                enum:
                  - submitted
                  - review_started
                  - approved
                  - rejected
                  - cancelled
                example: "approved"

  schemas:
    ReviewSubmission:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        # wiki_id:
        #   type: integer
        #   minimum: 1
        additional_information:
          type: string
          description: The user-submitted additional information
        state:
          type: string
          enum:
            - submitted
            - review_started
            - approved
            - rejected
            - cancelled
        submitted_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
